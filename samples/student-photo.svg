<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1400" viewBox="0 0 1300 1400">
  <defs></defs>
  <rect width="1300" height="1400" fill="#5b4a3a"/>
  <g transform="translate(170 170) rotate(4)">
  <rect width="1000" height="1000" fill="#fffdf8"/>
  <text x="40" y="70" font-size="40" font-family="Hiragino Sans, sans-serif" font-weight="bold">3年 わり算 テスト</text>
  <rect x="560" y="30" width="400" height="60" fill="none" stroke="#333" stroke-width="2"/>
  <text x="575" y="72" font-size="28" font-family="Hiragino Sans, sans-serif">名前  山田 はなこ</text>
  <g font-family="Hiragino Sans, sans-serif" font-size="32">
    <text x="60" y="230">1(1)  12 ÷ 3 =</text><text x="700" y="230" fill="#123" font-family="Bradley Hand, cursive">4</text>
    <text x="60" y="330">1(2)  56 ÷ 8 =</text><text x="700" y="330" fill="#123">9</text>
    <text x="60" y="430">1(3)  42 ÷ 7 =</text><text x="700" y="430" fill="#123">6</text>
    <text x="60" y="530">2(1)  17 ÷ 5 =</text><text x="700" y="530" fill="#123">3あまり2</text>
    <text x="60" y="630">2(2)  26 ÷ 5 =</text><text x="700" y="630" fill="#123">5あまり1</text>
    <text x="60" y="730">3  24このあめを3人で分けると1人何こ？</text><text x="700" y="780" fill="#123">8こ</text>
    <text x="60" y="860">4  51ページを1日8ページずつ読むと？</text><text x="620" y="920" fill="#123">6日で3ページのこる</text>
  </g>
</g>
</svg>